      (function () {
        var h = document.documentElement;
        function toggle() {
          var narrow = window.matchMedia('(max-width: 760px)').matches;
          if (narrow) { h.classList.toggle('sidebar-open'); return; }
          h.classList.toggle('sidebar-hidden');
          try { localStorage.setItem('etabli:sidebar', h.classList.contains('sidebar-hidden') ? 'hidden' : 'shown'); } catch (e) {}
        }
        document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('[data-toggle-sidebar]')) toggle(); });
        document.addEventListener('keydown', function (e) { if (e.metaKey && e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); toggle(); } });
        window.addEventListener('etabli:toggle-sidebar', toggle);
        // Le titre de la barre d'outils n'apparaît qu'une fois le grand titre de la page sorti de l'écran.
        function onScroll() { h.classList.toggle('scrolled', window.scrollY > 64); }
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
      })();
